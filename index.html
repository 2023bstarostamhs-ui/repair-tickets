<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Repair Ticket Manager</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed top-5 right-5 z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-3 bg-emerald-600 text-white px-5 py-3.5 rounded-xl shadow-xl">
    <div class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center">
      <i class="fa-solid fa-check text-white"></i>
    </div>
    <div>
      <h5 id="toast-title" class="font-bold text-sm leading-tight">Success</h5>
      <p id="toast-msg" class="text-xs text-emerald-100">Ticket created successfully.</p>
    </div>
  </div>

  <!-- LIGHT BLUE TOP NAVBAR -->
  <header class="bg-sky-500 text-white shadow-md sticky top-0 z-30 px-4 sm:px-8 py-3.5 flex items-center justify-between border-b border-sky-400">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center backdrop-blur-sm border border-white/30">
        <i class="fa-solid fa-screwdriver-wrench text-white text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight">IT Repair Ticket Manager</h1>
        <div class="flex items-center gap-2 text-xs text-sky-100">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="sync-status">Live Sync Active</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="openTicketModal('create')" class="bg-white text-sky-700 hover:bg-sky-50 font-semibold px-4 py-2 rounded-xl text-sm shadow-sm transition flex items-center gap-2">
        <i class="fa-solid fa-plus text-sky-600"></i>
        <span>New Repair Ticket</span>
      </button>
    </div>
  </header>

  <!-- MAIN BODY -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

    <!-- METRICS OVERVIEW CARDS -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white border border-sky-100 p-4 rounded-2xl shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Tickets</p>
          <h3 id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-11 h-11 bg-sky-50 rounded-xl flex items-center justify-center text-sky-600">
          <i class="fa-solid fa-ticket text-lg"></i>
        </div>
      </div>

      <div class="bg-white border border-sky-100 p-4 rounded-2xl shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-amber-500 uppercase tracking-wider">In Progress</p>
          <h3 id="stat-progress" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-11 h-11 bg-amber-50 rounded-xl flex items-center justify-center text-amber-600">
          <i class="fa-solid fa-gears text-lg"></i>
        </div>
      </div>

      <div class="bg-white border border-sky-100 p-4 rounded-2xl shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-emerald-500 uppercase tracking-wider">Ready for Pickup</p>
          <h3 id="stat-ready" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
        </div>
        <div class="w-11 h-11 bg-emerald-50 rounded-xl flex items-center justify-center text-emerald-600">
          <i class="fa-solid fa-circle-check text-lg"></i>
        </div>
      </div>

      <div class="bg-white border border-sky-100 p-4 rounded-2xl shadow-sm flex items-center justify-between">
        <div>
          <p class="text-xs font-semibold text-sky-600 uppercase tracking-wider">Total Revenue ($)</p>
          <h3 id="stat-revenue" class="text-2xl font-bold text-slate-800 mt-1">$0.00</h3>
        </div>
        <div class="w-11 h-11 bg-sky-50 rounded-xl flex items-center justify-center text-sky-600">
          <i class="fa-solid fa-file-invoice-dollar text-lg"></i>
        </div>
      </div>
    </section>

    <!-- SEARCH & FILTER TOOLBAR -->
    <section class="bg-white border border-sky-100 p-4 rounded-2xl shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="relative w-full md:w-80">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" oninput="renderTickets()" placeholder="Search client, device, or ID..." class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white transition">
      </div>

      <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl overflow-x-auto w-full md:w-auto text-xs font-semibold">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn active px-3.5 py-1.5 rounded-lg bg-sky-500 text-white shadow-sm transition">All</button>
        <button onclick="setFilter('Open')" id="filter-Open" class="filter-btn px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sky-600 transition">Open</button>
        <button onclick="setFilter('In Progress')" id="filter-In Progress" class="filter-btn px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sky-600 transition">In Progress</button>
        <button onclick="setFilter('Waiting for Parts')" id="filter-Waiting for Parts" class="filter-btn px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sky-600 transition">Parts Needed</button>
        <button onclick="setFilter('Ready for Pickup')" id="filter-Ready for Pickup" class="filter-btn px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sky-600 transition">Ready</button>
        <button onclick="setFilter('Completed')" id="filter-Completed" class="filter-btn px-3.5 py-1.5 rounded-lg text-slate-600 hover:text-sky-600 transition">Completed</button>
      </div>
    </section>

    <!-- REPAIR TICKETS GRID -->
    <section id="tickets-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <!-- Dynamic Tickets Rendered Here -->
    </section>

  </main>

  <!-- CREATE / EDIT TICKET MODAL -->
  <div id="ticket-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 items-center justify-center p-4">
    <div class="bg-white border border-sky-100 rounded-2xl w-full max-w-xl shadow-2xl overflow-hidden">
      
      <div class="bg-sky-500 text-white px-6 py-4 flex items-center justify-between">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <i class="fa-solid fa-wrench"></i>
          <span id="modal-title-text">Create New Repair Ticket</span>
        </h3>
        <button type="button" onclick="closeTicketModal()" class="text-white/80 hover:text-white transition"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <form id="ticket-form" onsubmit="saveTicket(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
        <input type="hidden" id="ticket-doc-id">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Client Name *</label>
            <input type="text" id="client-name" required placeholder="e.g. John Doe" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Phone Number *</label>
            <input type="tel" id="client-phone" required placeholder="e.g. (555) 019-2834" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Device Model *</label>
            <input type="text" id="device-model" required placeholder="e.g. iPhone 14 Pro / Dell XPS" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Passcode / PIN</label>
            <input type="text" id="device-pin" placeholder="e.g. 1234 or Pattern" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Issue Description *</label>
          <textarea id="issue-desc" required rows="3" placeholder="Describe problem or physical damage..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white"></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Status</label>
            <select id="ticket-status" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500">
              <option value="Open">Open (New)</option>
              <option value="In Progress">In Progress</option>
              <option value="Waiting for Parts">Waiting for Parts</option>
              <option value="Ready for Pickup">Ready for Pickup</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Priority</label>
            <select id="ticket-priority" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500">
              <option value="Normal">Normal</option>
              <option value="High">High Priority</option>
              <option value="Urgent">Urgent / Rush</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Est. Cost ($)</label>
            <input type="number" id="estimated-cost" step="0.01" min="0" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Deposit ($)</label>
            <input type="number" id="deposit-paid" step="0.01" min="0" placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-sm text-slate-800 focus:outline-none focus:border-sky-500 focus:bg-white">
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
          <button type="button" onclick="closeTicketModal()" class="px-5 py-2 text-sm font-semibold text-slate-500 hover:text-slate-800 transition">Cancel</button>
          <button type="submit" class="bg-sky-500 hover:bg-sky-600 text-white px-6 py-2 rounded-xl text-sm font-semibold transition shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-check"></i>
            <span>Save Ticket</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- PRINT RECEIPT MODAL -->
  <div id="receipt-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl w-full max-w-md p-6 shadow-2xl space-y-4">
      <div id="printable-receipt" class="space-y-4">
        <div class="text-center border-b pb-3">
          <h2 class="text-xl font-bold text-sky-600">IT REPAIR SHOP</h2>
          <p class="text-xs text-slate-500">Service Claim Receipt</p>
          <p id="receipt-date" class="text-xs text-slate-400 mt-1"></p>
        </div>

        <div class="text-sm space-y-2">
          <div class="flex justify-between font-mono bg-sky-50 p-2 rounded-lg">
            <span>Ticket ID:</span>
            <span id="receipt-id" class="font-bold text-sky-700"></span>
          </div>
          <div><strong>Client:</strong> <span id="receipt-client"></span></div>
          <div><strong>Phone:</strong> <span id="receipt-phone"></span></div>
          <div><strong>Device:</strong> <span id="receipt-device"></span></div>
          <div><strong>Passcode:</strong> <span id="receipt-pin"></span></div>
          <div><strong>Issue:</strong> <span id="receipt-issue"></span></div>
          <div class="border-t pt-2 flex justify-between font-semibold">
            <span>Est. Total:</span>
            <span id="receipt-cost"></span>
          </div>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-2 border-t">
        <button type="button" onclick="closeReceiptModal()" class="px-4 py-2 text-xs font-semibold text-slate-500">Close</button>
        <button type="button" onclick="window.print()" class="bg-sky-500 text-white px-4 py-2 rounded-xl text-xs font-semibold"><i class="fa-solid fa-print mr-1"></i> Print Ticket</button>
      </div>
    </div>
  </div>

  <!-- FIREBASE & CORE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyBfycxm5fQhK5LlAW0zK8aHcqtRPpThRZY",
      authDomain: "ticket-c83a4.firebaseapp.com",
      databaseURL: "https://ticket-c83a4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ticket-c83a4",
      storageBucket: "ticket-c83a4.firebasestorage.app",
      messagingSenderId: "55481704726",
      appId: "1:55481704726:web:b261a4ce73b3c9d13eb037",
      measurementId: "G-189VCJ75NC"
    };

    let db = null;
    let allTickets = [];
    let currentFilter = 'all';

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      
      // REAL-TIME FIREBASE SYNC
      onSnapshot(collection(db, "tickets"), (snapshot) => {
        const remoteTickets = [];
        snapshot.forEach((docSnap) => {
          remoteTickets.push({ id: docSnap.id, ...docSnap.data() });
        });

        if (remoteTickets.length > 0) {
          allTickets = remoteTickets;
          localStorage.setItem("local_tickets", JSON.stringify(allTickets));
        } else {
          loadFromLocalStorage();
        }
        updateMetrics();
        window.renderTickets();
      }, (error) => {
        console.warn("Firebase Live Sync Error (fallback to local storage):", error.message);
        document.getElementById("sync-status").textContent = "Local Offline Mode";
        loadFromLocalStorage();
      });

    } catch (e) {
      console.warn("Firebase Init Error:", e);
      loadFromLocalStorage();
    }

    function loadFromLocalStorage() {
      allTickets = JSON.parse(localStorage.getItem("local_tickets") || "[]");
      updateMetrics();
      window.renderTickets();
    }

    // TOAST NOTIFIER
    window.showToast = (title, msg) => {
      const toast = document.getElementById("toast");
      document.getElementById("toast-title").textContent = title;
      document.getElementById("toast-msg").textContent = msg;

      toast.classList.remove("-translate-y-20", "opacity-0");
      toast.classList.add("translate-y-0", "opacity-100");

      setTimeout(() => {
        toast.classList.remove("translate-y-0", "opacity-100");
        toast.classList.add("-translate-y-20", "opacity-0");
      }, 2500);
    };

    // UPDATE METRICS
    function updateMetrics() {
      document.getElementById("stat-total").textContent = allTickets.length;
      
      const progressCount = allTickets.filter(t => t.status === "In Progress" || t.status === "Open" || t.status === "Waiting for Parts").length;
      document.getElementById("stat-progress").textContent = progressCount;

      const readyCount = allTickets.filter(t => t.status === "Ready for Pickup").length;
      document.getElementById("stat-ready").textContent = readyCount;

      const revenue = allTickets.reduce((acc, t) => acc + (Number(t.estimatedCost) || 0), 0);
      document.getElementById("stat-revenue").textContent = `$${revenue.toFixed(2)}`;
    }

    // FILTER TICKETS
    window.setFilter = (status) => {
      currentFilter = status;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-white', 'shadow-sm');
        btn.classList.add('text-slate-600');
      });

      const activeBtn = document.getElementById(`filter-${status}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-sky-500', 'text-white', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600');
      }

      window.renderTickets();
    };

    // RENDER TICKETS CARD GRID
    window.renderTickets = () => {
      const container = document.getElementById("tickets-container");
      const search = (document.getElementById("search-input").value || "").toLowerCase();

      container.innerHTML = "";

      const filtered = allTickets.filter(t => {
        const matchesSearch = 
          (t.client || "").toLowerCase().includes(search) ||
          (t.phone || "").toLowerCase().includes(search) ||
          (t.device || "").toLowerCase().includes(search) ||
          (t.ticketNumber || "").toLowerCase().includes(search);
        
        const matchesStatus = currentFilter === 'all' || t.status === currentFilter;

        return matchesSearch && matchesStatus;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white border border-dashed border-sky-200 rounded-2xl p-12 text-center text-slate-400">
            <i class="fa-solid fa-ticket-simple text-4xl mb-3 text-sky-200"></i>
            <p class="font-medium text-slate-600">No repair tickets found.</p>
            <p class="text-xs text-slate-400 mt-1">Click "New Repair Ticket" above to add one.</p>
          </div>
        `;
        return;
      }

      filtered.forEach(t => {
        const statusColors = {
          'Open': 'bg-sky-100 text-sky-700 border-sky-300',
          'In Progress': 'bg-amber-100 text-amber-700 border-amber-300',
          'Waiting for Parts': 'bg-purple-100 text-purple-700 border-purple-300',
          'Ready for Pickup': 'bg-emerald-100 text-emerald-700 border-emerald-300',
          'Completed': 'bg-slate-100 text-slate-600 border-slate-300',
          'Cancelled': 'bg-rose-100 text-rose-700 border-rose-300'
        };

        const badgeClass = statusColors[t.status] || 'bg-slate-100 text-slate-600';

        container.innerHTML += `
          <div class="bg-white border border-sky-100 hover:border-sky-300 rounded-2xl p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4">
            
            <div>
              <div class="flex items-center justify-between gap-2 mb-2">
                <span class="text-xs font-mono font-bold text-sky-600 bg-sky-50 px-2.5 py-1 rounded-lg border border-sky-100">
                  ${t.ticketNumber || 'TK-SHOP'}
                </span>
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeClass}">
                  ${t.status || 'Open'}
                </span>
              </div>

              <h4 class="font-bold text-slate-800 text-base leading-snug">${t.device || 'Unknown Device'}</h4>
              <p class="text-xs text-slate-500 mt-0.5"><i class="fa-solid fa-user text-sky-400 mr-1"></i>${t.client || 'N/A'} • <i class="fa-solid fa-phone text-sky-400 mr-1"></i>${t.phone || 'N/A'}</p>
            </div>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-1.5 text-xs">
              <div><strong class="text-slate-600">Issue:</strong> <span class="text-slate-700">${t.issue || 'No details.'}</span></div>
              ${t.pin ? `<div><strong class="text-slate-600">PIN:</strong> <span class="font-mono bg-white px-1.5 py-0.5 rounded border border-slate-200">${t.pin}</span></div>` : ''}
              <div class="flex justify-between pt-1 border-t border-slate-200/60 font-semibold">
                <span class="text-slate-500">Est. Cost:</span>
                <span class="text-sky-700">$${Number(t.estimatedCost || 0).toFixed(2)}</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-2 border-t border-slate-100">
              <select onchange="updateTicketStatus('${t.id}', this.value)" class="text-xs bg-slate-100 font-semibold border border-slate-200 rounded-lg px-2 py-1 text-slate-700 focus:outline-none">
                <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
                <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                <option value="Waiting for Parts" ${t.status === 'Waiting for Parts' ? 'selected' : ''}>Waiting for Parts</option>
                <option value="Ready for Pickup" ${t.status === 'Ready for Pickup' ? 'selected' : ''}>Ready for Pickup</option>
                <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>
                <option value="Cancelled" ${t.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
              </select>

              <div class="flex items-center gap-1">
                <button onclick="openReceiptModal('${t.id}')" title="Print Receipt" class="text-sky-600 hover:text-sky-800 p-2 rounded-lg hover:bg-sky-50 transition">
                  <i class="fa-solid fa-print"></i>
                </button>
                <button onclick="openTicketModal('edit', '${t.id}')" title="Edit Ticket" class="text-slate-400 hover:text-sky-600 p-2 rounded-lg hover:bg-sky-50 transition">
                  <i class="fa-solid fa-pen-to-square"></i>
                </button>
                <button onclick="deleteTicket('${t.id}')" title="Delete Ticket" class="text-slate-400 hover:text-rose-600 p-2 rounded-lg hover:bg-rose-50 transition">
                  <i class="fa-solid fa-trash-can"></i>
                </button>
              </div>
            </div>

          </div>
        `;
      });
    };

    // SAVE TICKET FUNCTION (GUARANTEED CLOSING)
    window.saveTicket = async (e) => {
      e.preventDefault();

      const id = document.getElementById("ticket-doc-id").value;
      const payload = {
        client: document.getElementById("client-name").value,
        phone: document.getElementById("client-phone").value,
        device: document.getElementById("device-model").value,
        pin: document.getElementById("device-pin").value,
        issue: document.getElementById("issue-desc").value,
        status: document.getElementById("ticket-status").value,
        priority: document.getElementById("ticket-priority").value,
        estimatedCost: Number(document.getElementById("estimated-cost").value || 0),
        deposit: Number(document.getElementById("deposit-paid").value || 0),
        updatedAt: new Date().toISOString()
      };

      // 1. ALWAYS CLOSE MODAL IMMEDIATELY
      window.closeTicketModal();

      // 2. TRY FIREBASE SAVE
      let savedCloud = false;
      if (db) {
        try {
          if (id && !id.startsWith('local-')) {
            await updateDoc(doc(db, "tickets", id), payload);
          } else {
            payload.ticketNumber = `TK-${Math.floor(1000 + Math.random() * 9000)}`;
            payload.createdAt = new Date().toISOString();
            await addDoc(collection(db, "tickets"), payload);
          }
          savedCloud = true;
          window.showToast("✓ Saved", "Ticket saved to cloud.");
        } catch (err) {
          console.warn("Firebase save blocked by security rules:", err);
        }
      }

      // 3. FALLBACK TO LOCAL STORAGE
      if (!savedCloud) {
        let local = JSON.parse(localStorage.getItem("local_tickets") || "[]");
        if (id) {
          const idx = local.findIndex(t => t.id === id);
          if (idx !== -1) local[idx] = { ...local[idx], ...payload };
        } else {
          payload.id = "local-" + Date.now();
          payload.ticketNumber = `TK-${Math.floor(1000 + Math.random() * 9000)}`;
          payload.createdAt = new Date().toISOString();
          local.unshift(payload);
        }
        localStorage.setItem("local_tickets", JSON.stringify(local));
        allTickets = local;
        updateMetrics();
        window.renderTickets();
        window.showToast("✓ Saved Locally", "Saved to browser memory.");
      }
    };

    // UPDATE TICKET STATUS
    window.updateTicketStatus = async (id, newStatus) => {
      if (db && !id.startsWith('local-')) {
        try {
          await updateDoc(doc(db, "tickets", id), { status: newStatus });
        } catch (e) { console.warn(e); }
      }
      const ticket = allTickets.find(t => t.id === id);
      if (ticket) ticket.status = newStatus;
      localStorage.setItem("local_tickets", JSON.stringify(allTickets));
      updateMetrics();
      window.renderTickets();
      window.showToast("✓ Status Updated", `Status changed to ${newStatus}`);
    };

    // DELETE TICKET
    window.deleteTicket = async (id) => {
      if (confirm("Are you sure you want to delete this ticket?")) {
        if (db && !id.startsWith('local-')) {
          try { await deleteDoc(doc(db, "tickets", id)); } catch(e){}
        }
        allTickets = allTickets.filter(t => t.id !== id);
        localStorage.setItem("local_tickets", JSON.stringify(allTickets));
        updateMetrics();
        window.renderTickets();
        window.showToast("✓ Deleted", "Ticket removed.");
      }
    };

    // OPEN / CLOSE MODALS
    window.openTicketModal = (mode, id = null) => {
      const modal = document.getElementById("ticket-modal");
      const form = document.getElementById("ticket-form");
      form.reset();
      document.getElementById("ticket-doc-id").value = "";

      if (mode === 'edit' && id) {
        document.getElementById("modal-title-text").textContent = "Edit Repair Ticket";
        const ticket = allTickets.find(t => t.id === id);
        if (ticket) {
          document.getElementById("ticket-doc-id").value = ticket.id;
          document.getElementById("client-name").value = ticket.client || "";
          document.getElementById("client-phone").value = ticket.phone || "";
          document.getElementById("device-model").value = ticket.device || "";
          document.getElementById("device-pin").value = ticket.pin || "";
          document.getElementById("issue-desc").value = ticket.issue || "";
          document.getElementById("ticket-status").value = ticket.status || "Open";
          document.getElementById("ticket-priority").value = ticket.priority || "Normal";
          document.getElementById("estimated-cost").value = ticket.estimatedCost || "";
          document.getElementById("deposit-paid").value = ticket.deposit || "";
        }
      } else {
        document.getElementById("modal-title-text").textContent = "Create New Repair Ticket";
      }

      modal.classList.remove("hidden");
      modal.classList.add("flex");
    };

    window.closeTicketModal = () => {
      const modal = document.getElementById("ticket-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    };

    window.openReceiptModal = (id) => {
      const ticket = allTickets.find(t => t.id === id);
      if (!ticket) return;

      document.getElementById("receipt-id").textContent = ticket.ticketNumber || 'TK-SHOP';
      document.getElementById("receipt-client").textContent = ticket.client || 'N/A';
      document.getElementById("receipt-phone").textContent = ticket.phone || 'N/A';
      document.getElementById("receipt-device").textContent = ticket.device || 'N/A';
      document.getElementById("receipt-pin").textContent = ticket.pin || 'None';
      document.getElementById("receipt-issue").textContent = ticket.issue || 'N/A';
      document.getElementById("receipt-cost").textContent = `$${Number(ticket.estimatedCost || 0).toFixed(2)}`;
      document.getElementById("receipt-date").textContent = new Date().toLocaleDateString();

      const modal = document.getElementById("receipt-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    };

    window.closeReceiptModal = () => {
      const modal = document.getElementById("receipt-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    };
  </script>
</body>
</html>
