<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Repair Ticket Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <!-- LOGIN OVERLAY -->
  <div id="login-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 w-full max-w-md">
      <div class="text-center mb-6">
        <i class="fa-solid fa-wrench text-sky-400 text-4xl mb-2"></i>
        <h2 class="text-2xl font-bold text-white">IT Repair Portal</h2>
        <p class="text-slate-400 text-sm">Please sign in to access ticket management</p>
      </div>
      <div id="login-error" class="hidden bg-rose-500/20 border border-rose-500/50 text-rose-300 text-sm p-3 rounded-lg mb-4"></div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Email</label>
          <input type="email" id="auth-email" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Password</label>
          <input type="password" id="auth-password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-sky-500">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2 rounded-lg transition">Sign In</button>
      </form>
    </div>
  </div>

  <!-- APP CONTENT -->
  <div id="app-content" class="hidden">
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-wrench text-sky-400 text-2xl"></i>
        <h1 class="text-xl font-bold">IT Repair Ticket Manager</h1>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="copyCode()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 border border-slate-600 transition">
          <i class="fa-solid fa-copy"></i>
          <span id="copy-text">Copy Code</span>
        </button>
        <button onclick="logout()" class="bg-rose-600/80 hover:bg-rose-600 text-white px-3 py-1.5 rounded-lg text-sm transition">Sign Out</button>
      </div>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-semibold text-slate-300">Active Tickets</h2>
        <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg font-medium text-sm flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> New Ticket
        </button>
      </div>
      <div id="tickets-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>
  </div>

  <!-- MODAL -->
  <div id="ticket-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-40">
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md">
      <h3 class="text-lg font-bold mb-4">Create New Ticket</h3>
      <form id="ticket-form" class="space-y-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Device Name / Model</label>
          <input type="text" id="device-name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Issue Description</label>
          <textarea id="issue-desc" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white h-24"></textarea>
        </div>
        <div class="flex justify-end gap-3 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg">Save Ticket</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FIREBASE MODULES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // YOUR FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "AIzaSyBfycxm5fQhK5LlAW0zK8aHcqtRPpThRZY",
      authDomain: "ticket-c83a4.firebaseapp.com",
      databaseURL: "https://ticket-c83a4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ticket-c83a4",
      storageBucket: "ticket-c83a4.firebasestorage.app",
      messagingSenderId: "55481704726",
      appId: "1:55481704726:web:b261a4ce73b3c9d13eb037",
      measurementId: "G-189VCJ75NC"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Auth State Handler
    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("app-content").classList.remove("hidden");
        loadTickets();
      } else {
        document.getElementById("login-screen").classList.remove("hidden");
        document.getElementById("app-content").classList.add("hidden");
      }
    });

    // Login Handler
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("auth-email").value;
      const password = document.getElementById("auth-password").value;
      const errBox = document.getElementById("login-error");
      try {
        await signInWithEmailAndPassword(auth, email, password);
        errBox.classList.add("hidden");
      } catch (err) {
        errBox.textContent = "Login failed: " + err.message;
        errBox.classList.remove("hidden");
      }
    });

    // Logout Handler
    window.logout = () => signOut(auth);

    // Tickets Realtime Listener
    function loadTickets() {
      onSnapshot(collection(db, "tickets"), (snapshot) => {
        const list = document.getElementById("tickets-list");
        list.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const t = docSnap.data();
          list.innerHTML += `
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-start">
              <div>
                <h4 class="font-bold text-sky-400">${t.device}</h4>
                <p class="text-slate-300 text-sm mt-1">${t.issue}</p>
              </div>
              <button onclick="deleteTicket('${docSnap.id}')" class="text-slate-500 hover:text-rose-400 transition">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          `;
        });
      });
    }

    // Add Ticket
    document.getElementById("ticket-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "tickets"), {
        device: document.getElementById("device-name").value,
        issue: document.getElementById("issue-desc").value,
        created: new Date()
      });
      closeModal();
      document.getElementById("ticket-form").reset();
    });

    // Delete Ticket
    window.deleteTicket = (id) => deleteDoc(doc(db, "tickets", id));

    // Copy Code Feature
    window.copyCode = () => {
      navigator.clipboard.writeText(document.documentElement.outerHTML);
      document.getElementById("copy-text").textContent = "Copied!";
      setTimeout(() => document.getElementById("copy-text").textContent = "Copy Code", 2000);
    };

    // Modal Handlers
    window.openModal = () => document.getElementById("ticket-modal").classList.replace("hidden", "flex");
    window.closeModal = () => document.getElementById("ticket-modal").classList.replace("flex", "hidden");
  </script>
</body>
</html>
